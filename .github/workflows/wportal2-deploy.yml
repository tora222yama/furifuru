name: wportal2-deploy

on:
  push:
    branches:
      - release

permissions:  
  id-token: write
  contents: read

env:
  ECR_REGISTRY: 979109089196.dkr.ecr.ap-northeast-1.amazonaws.com
  ECR_REPOSITORY: wportal2_ecr_repository

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: configure aws credential
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: arn:aws:iam::979109089196:role/wportal2_deploy_iam_role
          aws-region: ap-northeast-1

      # Source step
      - name: Source step - gitからコード取得
        uses: actions/checkout@v2
      - name: Source step - List files
        run: |
          ls -l

      # Build step
      - name: Build step -
        run: |
          echo "実行場所のイメージがまだ定まっていない"
          echo "Build step (Dockerイメージを作成し、ECRに保存する)"
          echo "以下イメージ"
          echo "専用のdocker-composeでwebコンテナをビルド"
          echo "コンテナに入る？"
          echo "ディレクトリ変更？"
          echo "[composer install]以降の実行"
          echo "docker build -t $IMAGEのようにイメージを作成してECRに送る"      

      # ビルド設定.
      - name: Build step - setup buildx
        uses: docker/setup-buildx-action@v1

      # キャッシュ対応.
#      - name: Cache step
#        uses: actions/cache@v2
#        with:
#          path: /tmp/.buildx-cache
#          key: ${{ runner.os }}-buildx-${{ github.sha }}
#          restore-keys: |
#            ${{ runner.os }}-buildx-

      # ECRログイン.
      - name: Build step - login to ECR
        uses: docker/login-action@v2
        with:
          registry: ${{ env.ECR_REGISTRY }}

      # docker-compose(with cache)でビルド.
      - name: Build step - docker-compose build
        run: |
          docker buildx bake \
            --file docker-compose-for-service.yml
#            --set='*.cache-from=type=local,src=/tmp/.buildx-cache' \
#            --set='*.cache-to=type=local,dest=/tmp/.buildx-cache'

      # コンテナを起動して、コマンド実行.
      - name: Build step - docker-compose up and build.
        run: |
          cp wportal2-app/.env.prd.sample wportal2-app/.env
          echo "TODO: 環境変数を設定する"
          docker compose -f docker-compose-for-service.yml up -d
          docker compose -f docker-compose-for-service.yml ps
          docker exec service_container_web composer install
          docker exec service_container_web php artisan key:generate
          docker exec service_container_web npm ci
          docker exec service_container_web npm run build
          # テストでenvの値を確認する.
          cat wportal2-app/.env

      # ECRへのpush.
      - name: Build step - docker-compose push
        run: |
          echo "docker-composeでビルドしたイメージをECRにpush"
          docker compose -f docker-compose-for-service.yml push

      # キャッシュ削除.
#      - name: Move cache
#        run: |
#          rm -rf /tmp/.buildx-cache
#          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      - name: Deploy step - render task
        id: render-task
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: wportal2-container
          image: 979109089196.dkr.ecr.ap-northeast-1.amazonaws.com/wportal2_ecr_service_container:latest

      - name: Deploy step - deploy task
        id: deploy-task
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.render-task.outputs.task-definition }}
          service: wportal2-ecs-service
          cluster: wportal2-ecs-cluster
          wait-for-service-stability: true
