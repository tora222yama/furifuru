    runs-on: ubuntu-latest
    steps:
      - name: configure aws credential
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: arn:aws:iam::979109089196:role/wportal2_deploy_iam_role
          aws-region: ap-northeast-1

