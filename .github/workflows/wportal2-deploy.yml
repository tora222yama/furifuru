name: wportal2-deploy

on:
  push:
    branches:
      - release

permissions:  
  id-token: write
  contents: read

env:
  ECR_REGISTRY: 979109089196.dkr.ecr.ap-northeast-1.amazonaws.com
  ECR_REPOSITORY: wportal2_ecr_repository

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: configure aws credential
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: arn:aws:iam::979109089196:role/wportal2_deploy_iam_role
          aws-region: ap-northeast-1

      # Source step
      - name: Source step - gitからコード取得
        uses: actions/checkout@v2
      - name: Source step - List files
        run: |
          ls -l      

      # ビルド設定.
      - name: Build step - setup buildx
        uses: docker/setup-buildx-action@v1

      # キャッシュ対応.
#      - name: Cache step
#        uses: actions/cache@v2
#        with:
#          path: /tmp/.buildx-cache
#          key: ${{ runner.os }}-buildx-${{ github.sha }}
#          restore-keys: |
#            ${{ runner.os }}-buildx-

      # ECRログイン.
      - name: Build step - login to ECR
        uses: docker/login-action@v2
        with:
          registry: ${{ env.ECR_REGISTRY }}

      # envの準備.
      - name: Build step - prepare .env
        run: |
          cp wportal2-app/.env.prd.sample wportal2-app/.env
          echo DB_HOST="$(aws ssm get-parameter --name /wportal/db/host --query Parameter.Value --output text)" >> wportal2-app/.env
          echo DB_USERNAME="$(aws ssm get-parameter --name /wportal/db/username --query Parameter.Value --output text)" >> wportal2-app/.env
          echo DB_PASSWORD="$(aws ssm get-parameter --name /wportal/db/password --query Parameter.Value --output text)" >> wportal2-app/.env
          echo REDIS_HOST="$(aws ssm get-parameter --name /wportal/redis/host --query Parameter.Value --output text)" >> wportal2-app/.env
          echo GOOGLE_CLIENT_ID="$(aws ssm get-parameter --name /wportal/google_client_id --query Parameter.Value --output text)" >> wportal2-app/.env
          echo GOOGLE_CLIENT_SECRET="$(aws ssm get-parameter --name /wportal/google_client_secret --query Parameter.Value --output text)" >> wportal2-app/.env
          echo SLACK_APP_TOKEN="$(aws ssm get-parameter --name /wportal/slack_app_token --query Parameter.Value --output text)" >> wportal2-app/.env
          echo SLACK_BOT_USER_OAUTH_TOKEN="$(aws ssm get-parameter --name /wportal/slack_bot_user_oauth_token --query Parameter.Value --output text)" >> wportal2-app/.env
          echo SLACK_URL_NOTICE="$(aws ssm get-parameter --name /wportal/slack_url_notice --query Parameter.Value --output text)" >> wportal2-app/.env
          echo RECAPTCHA_SECRET_KEY="$(aws ssm get-parameter --name /wportal/recaptcha_secret_key --query Parameter.Value --output text)" >> wportal2-app/.env
          echo VITE_RECAPTCHA_SITE_KEY="$(aws ssm get-parameter --name /wportal/vite_recaptcha_site_key --query Parameter.Value --output text)" >> wportal2-app/.env
          echo APP_AWS_ACCESS_KEY_ID="$(aws ssm get-parameter --name /wportal/app_aws_access_key_id --query Parameter.Value --output text)" >> wportal2-app/.env
          echo APP_AWS_SECRET_ACCESS_KEY="$(aws ssm get-parameter --name /wportal/app_aws_secret_access_key --query Parameter.Value --output text)" >> wportal2-app/.env
          echo APP_AWS_REGION="$(aws ssm get-parameter --name /wportal/app_aws_region --query Parameter.Value --output text)" >> wportal2-app/.env
#          docker compose -f docker-compose-for-service.yml build
#          docker compose -f docker-compose-for-service.yml up -d
#          docker compose -f docker-compose-for-service.yml ps
#          docker exec service_container_web composer install
#          docker exec service_container_web php artisan key:generate
#          docker exec service_container_web npm ci
#          docker exec service_container_web npm run build

      # docker-compose(with cache)でビルド.
      - name: Build step - docker-compose build
        run: |
          docker compose -f docker-compose-for-service.yml build
          docker compose -f docker-compose-for-service.yml up -d
          docker compose -f docker-compose-for-service.yml ps
#        run: |
#          docker buildx bake \
#            --file docker-compose-for-service.yml
#            --set='*.cache-from=type=local,src=/tmp/.buildx-cache' \
#            --set='*.cache-to=type=local,dest=/tmp/.buildx-cache'

      # ECRへのpush.
      - name: Build step - docker-compose push
        run: |
          echo "docker-composeでビルドしたイメージをECRにpush"
          docker compose -f docker-compose-for-service.yml push      

      # タスク定義作成.
      - name: Deploy step - render task
        id: render-task
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: wportal2-container
          image: 979109089196.dkr.ecr.ap-northeast-1.amazonaws.com/wportal2_ecr_service_container:latest

      # タスク定義のデプロイ.
      - name: Deploy step - deploy task
        id: deploy-task
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.render-task.outputs.task-definition }}
          service: wportal2-ecs-service
          cluster: wportal2-ecs-cluster
          wait-for-service-stability: true

      # キャッシュ削除.
#      - name: Move cache
#        run: |
#          rm -rf /tmp/.buildx-cache
#          mv /tmp/.buildx-cache-new /tmp/.buildx-cache
