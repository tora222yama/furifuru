name: slack-notice

on:
  push:
    branches:
      - add-slack-notice

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: notice
        run: |
          echo "Notice to slack"
          curl -X POST -H 'Content-type: application/json' --data '{"text":"GitHub Actionsからの通知テスト"}' https://hooks.slack.com/services/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