name: wportal2-command

on:
  workflow_dispatch:
    inputs:
      command:
        description: 'Command'
        required: true
        default: 'php artisan route:list'

permissions:
  id-token: write
  contents: read

#env:
#  ECR_REGISTRY: 979109089196.dkr.ecr.ap-northeast-1.amazonaws.com
#  ECR_REPOSITORY: wportal2_ecr_repository
#  TASK_CLUSTER_NAME: arn:aws:ecs:ap-northeast-1:979109089196:cluster/wportal2-ecs-cluster
#  TASK_FAMILY_NAME: wportal2-task
#  TASK_LOG_GROUP_NAME: /wportal2/ecs

env:
  AWS_REGION: "ap-northeast-1"
  AWS_ECS_CLUSTER: arn:aws:ecs:ap-northeast-1:979109089196:cluster/wportal2-ecs-cluster
  AWS_ECS_SERVICE: arn:aws:ecs:ap-northeast-1:979109089196:service/wportal2-ecs-cluster/wportal2-ecs-service
  AWS_ECS_TASK: "wportal2-task"
  CONTAINER_NAME: "wportal2-container"

jobs:
  command:
    runs-on: ubuntu-latest
    steps:
      - name: test
        run: |
          echo "input-command: ${{ github.event.inputs.command }}"

      - name: configure aws credential
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: arn:aws:iam::979109089196:role/wportal2_deploy_iam_role
          aws-region: ap-northeast-1

      # 最新タスク定義の取得.
      - name: Get latest task definition revision
        id: get-latest-task-def
        env:
          TASK_FAMILY: ${{ env.AWS_ECS_TASK }}
        run: |
          LATEST_TASK_DEF=$(aws ecs list-task-definitions --family-prefix ${{ env.TASK_FAMILY }} --sort DESC --max-items 1 --query "taskDefinitionArns[0]")
          echo "latest_task_def=$LATEST_TASK_DEF" >> $GITHUB_OUTPUT

      # ネットワーク設定の取得.
      - name: Get ECS service network configuration
        id: get-network-config
        env:
          CLUSTER_NAME: ${{ env.AWS_ECS_CLUSTER }}
          SERVICE_NAME: ${{ env.AWS_ECS_TASK }}
        run: |
          NETWORK_CONFIG=$(aws ecs describe-services --cluster ${{ env.CLUSTER_NAME }} --services ${{ env.SERVICE_NAME }} --query "services[0].networkConfiguration.awsvpcConfiguration" --output json)
          SUBNET=$(echo $NETWORK_CONFIG | jq -r '.subnets[0]')
          SECURITY_GROUP=$(echo $NETWORK_CONFIG | jq -r '.securityGroups[0]')
          echo "subnet=${SUBNET}" >> $GITHUB_OUTPUT
          echo "security_group=${SECURITY_GROUP}" >> $GITHUB_OUTPUT

      # 実施前のecho test
      - name: Echo test
        env:
          LATEST_TASK_DEF: ${{ steps.get-latest-task-def.outputs.latest_task_def }}
          ECS_TASK_SUBNET: ${{ steps.get-network-config.outputs.subnet }}
          ECS_TASK_SECURITY_GROUP: ${{ steps.get-network-config.outputs.security_group }}
        run: |
          echo "${{ env.AWS_ECS_CLUSTER }}"
          echo "${{ env.LATEST_TASK_DEF }}"
          echo 'awsvpcConfiguration={subnets=["subnet-09ca2883e479b74dd", "subnet-00cdd25fc7a991867"],securityGroups=["sg-04d892c8cc26c7158"],assignPublicIp="DISABLED"}'
          echo '{"containerOverrides": [{"name": "${{ env.CONTAINER_NAME }}", "command": ["sleep", "7200"]}]}'

      # ECSタスクの実行.
      #             --overrides '{"containerOverrides": [{"name": "${{ env.CONTAINER_NAME }}", "command": ["php", "artisan", "test:test:SendSes", "miki-yoji@919.jp"]}]}' \
      - name: Run ECS Task
        id: run-ecs-task
        env:
          LATEST_TASK_DEF: ${{ steps.get-latest-task-def.outputs.latest_task_def }}
          ECS_TASK_SUBNET: ${{ steps.get-network-config.outputs.subnet }}
          ECS_TASK_SECURITY_GROUP: ${{ steps.get-network-config.outputs.security_group }}
          CONTAINER_NAME: "wportal2-container"
        run: |
          TASK_ARN=$(aws ecs run-task \
            --cluster ${{ env.AWS_ECS_CLUSTER }} \
            --launch-type FARGATE \
            --enable-execute-command \
            --task-definition ${{ env.LATEST_TASK_DEF }} \
            --network-configuration 'awsvpcConfiguration={subnets=["subnet-09ca2883e479b74dd", "subnet-00cdd25fc7a991867"],securityGroups=["sg-04d892c8cc26c7158"],assignPublicIp="DISABLED"}' \
            --tags key=StartedBy,value=GitHubActions \
            --count 1 \
            --query tasks[0].taskArn --output text)
          echo "TASK_ARN: $TASK_ARN"
          echo "TASK_ARN=$TASK_ARN" >> $GITHUB_OUTPUT

      # ECSのタスク起動を待つ.
      - name: Wait ECS Task
        id: wait-ecs-task
        continue-on-error: true
        env:
          TASK_ARN: ${{ steps.run-ecs-task.outputs.TASK_ARN }}
        run: |
          aws ecs wait tasks-running --cluster ${{ env.AWS_ECS_CLUSTER }} --tasks ${{ env.TASK_ARN }}

      # コマンドの確認
      - name: Confirm ECS Command
        id: confirm-ecs-command
        continue-on-error: true
        env:
          TASK_ARN: ${{ steps.run-ecs-task.outputs.TASK_ARN }}
        run: |
          RESULT=$(aws ecs describe-tasks \
            --region ap-northeast-1 \
            --cluster ${{ env.AWS_ECS_CLUSTER }} \
            --task ${{ env.TASK_ARN }})
          echo "RESULT: $RESULT"

      # 設定の確認のための準備.
      - name: Prepare confirm
        continue-on-error: true
        run: |
          git clone https://github.com/aws-containers/amazon-ecs-exec-checker.git

      # 設定の確認
      - name: Confirm setting
        id: confirm-setting
        continue-on-error: true
        env:
          TASK_ARN: ${{ steps.run-ecs-task.outputs.TASK_ARN }}
        run: |
          ls
          cd amazon-ecs-exec-checker
          ls
          ./check-ecs-exec.sh ${{ env.AWS_ECS_CLUSTER }} ${{ env.TASK_ARN }}
          cd ..
          ls

      # ECSコマンドの実行.
      - name: Exec ECS Command
        id: exec-ecs-command
        continue-on-error: true
        env:
          TASK_ARN: ${{ steps.run-ecs-task.outputs.TASK_ARN }}
        run: |
          sudo apt install -y expect
          unbuffer aws ecs execute-command --cluster ${{ env.AWS_ECS_CLUSTER }} --task ${{ env.TASK_ARN }} --container ${{ env.CONTAINER_NAME }} --interactive --command "${{ github.event.inputs.command }}"

      # ECSタスクの終了.
      - name: Stop ECS Task
        id: stop-ecs-task
        env:
          TASK_ARN: ${{ steps.run-ecs-task.outputs.TASK_ARN }}
        run: |
          aws ecs stop-task --cluster ${{ env.AWS_ECS_CLUSTER }} --task ${{ env.TASK_ARN }}

