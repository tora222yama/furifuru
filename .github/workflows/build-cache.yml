name: build-cache

on:
  push:
    branches:
      - build-cache

permissions:
  id-token: write
  contents: read

jobs:
  build-cache:
    runs-on: ubuntu-latest
    steps:
      # Source step
      - name: Source step - gitからコード取得
        uses: actions/checkout@v2
      - name: Source step - List files
        run: |
          ls -l

      # ビルド設定.
      - name: Build step - setup buildx
        id: buildx
        uses: docker/setup-buildx-action@v1

      # キャッシュ対応.
      - name: Cache step
        uses: actions/cache@v2
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      # envの準備.
      - name: Build step - prepare .env
        run: |
          cp wportal2-app/.env.prd.sample wportal2-app/.env

      # Buildxでイメージをビルドする
      - name: Build images - App
        uses: docker/build-push-action@v4
        with:
          push: false
          builder: ${{ steps.buildx.outputs.name }} # Buildxでビルドすることを指定
          tags: 979109089196.dkr.ecr.ap-northeast-1.amazonaws.com/wportal2_ecr_service_container:latest # イメージ名を指定/docker-compose.ymlで参照する名前
          load: true
          context: .
          file: ./Dockerfile
          cache-from: type=local,src=/tmp/.buildx-cache # キャッシュを指定
          cache-to: type=local,dest=/tmp/.buildx-cache-new # キャッシュを指定

      # docker-compose(with cache)でビルド.
      - name: Build step - docker-compose build
        run: |
          docker compose -f docker-compose-for-service.yml build
          docker compose -f docker-compose-for-service.yml up -d
          docker compose -f docker-compose-for-service.yml ps

      # キャッシュ削除.
      - name: Move cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache