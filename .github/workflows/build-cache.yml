name: build-cache

on:
  push:
    branches:
      - build-cache

permissions:
  id-token: write
  contents: read

jobs:
  build-cache:
    runs-on: ubuntu-latest
    steps:
      # Source step
      - name: Source step - gitからコード取得
        uses: actions/checkout@v2
      - name: Source step - List files
        run: |
          ls -l

      # ビルド設定.
      - name: Build step - setup buildx
        uses: docker/setup-buildx-action@v1

      # キャッシュ対応.
      - name: Cache step
        uses: actions/cache@v2
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-