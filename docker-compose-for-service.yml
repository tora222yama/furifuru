###########################
# wportal2
# リリース環境用

services:
  ###################################
  # wportal_web : php + Apacheサーバー
  service_container_web:
    container_name: service_container_web
    build: wportal2-app/service_container/web
    environment:
      - APP_TIMEOUT=60
      - PHP_MEMORY_LIMIT=256M
      - PHP_MAX_UPLOAD=20M
    working_dir: /var/www/html/wportal2-app
    ports:
      - "80:80"
    networks:
      - service_container_net
    volumes:
      - ./:/var/www/html

networks:
  service_container_net:
    driver: bridge