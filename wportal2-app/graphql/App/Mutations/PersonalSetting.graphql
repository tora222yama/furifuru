# 個人設定の更新.
mutation AppPersonalSettingEditUpdate(
  $trnUserId: Int!
  $nickname: String!
  $slackUserId: String
  $slackUserName: String
  $slackTeamId: String
  $upload: Upload
) {
  AppPersonalSettingEditUpdate(
    trnUserId: $trnUserId,
    nickname: $nickname,
    slackUserId: $slackUserId
    slackUserName: $slackUserName
    slackTeamId: $slackTeamId
    upload: $upload
  ) {
    status_code
    status_message
    errors
  }
}
