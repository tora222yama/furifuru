# npm run lefthook で実行可能

pre-commit:
  parallel: false
  commands:
    tsc:
      glob: '*.{ts,tsx}'
      run: npm run tsc --prefix ./laravel-inertia-template-app
    prettier:
      glob: '*.{ts,tsx}'
      run: |
        ./laravel-inertia-template-app/node_modules/.bin/prettier --write {staged_files}
        git add {staged_files}
    eslint:
      glob: '*.{ts,tsx}'
      run: |
        ./laravel-inertia-template-app/node_modules/.bin/eslint --fix {staged_files}
    pint:
      glob: '*.{php}'
      run: |
        ./laravel-inertia-template-app/vendor/bin/pint {staged_files}
        git add {staged_files}
    ide-helper:
      glob: '*.{php}'
      run: |
        cd ./laravel-inertia-template-app
        php artisan ide-helper:generate
        php artisan ide-helper:models -N
    graphql:
      glob: '*'
      run: |
        cd ./laravel-inertia-template-app
        php artisan lighthouse:ide-helper

