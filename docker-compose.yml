###########################
# laravel-inertia-template
# Vite+SSRで作成するプロジェクトのサンプル
# ローカル開発環境

services:
  ###########################
  # template_web : php + Apache + Composer + npm
  # webサーバー
  template_web:
    container_name: template_web
    build: ./laravel-inertia-template-app/docker/web
    env_file:
      - ./laravel-inertia-template-app/.env
    environment:
      - APP_TIMEOUT=60
      - PHP_MEMORY_LIMIT=256M
      - PHP_MAX_UPLOAD=20M
    working_dir: /var/www/html/laravel-inertia-template-app
    ports:
      - "9190:80"   # Laravel用
      - "5173:5173" # Vite用
    networks:
      - template_local
    volumes:
      - ./:/var/www/html

  ###########################
  # template_db : mysql 8.0
  # DBサーバー
  template_db:
    image: mysql:8.0
    container_name: 'template_db'
    ports:
      - 3306:3306
    environment:
      MYSQL_DATABASE: template
      MYSQL_USER: template
      MYSQL_PASSWORD: template
      MYSQL_ROOT_PASSWORD: template
      TZ: 'Asia/Tokyo'
    volumes:
      - template_db_volume:/var/lib/mysql
    networks:
      - template_local

  ###########################
  # template_redis : Redis 7.2 cache server
  # Redisサーバー
  template_redis:
    container_name: template_redis
    image: redis:7.2
    ports:
      - "6379:6379"
    networks:
      - template_local
    volumes:
      - template_redis_volume:/data

networks:
  template_local:
    name: template_local
    driver: bridge
    driver_opts:
      com.docker.network.enable_ipv6: "false"
    ipam:
      driver: default
      config:
        - subnet: 172.16.246.0/24 # 他と衝突しなければなんでも良い認識

volumes:
  template_db_volume:
    driver: local
  template_redis_volume:
    driver: local