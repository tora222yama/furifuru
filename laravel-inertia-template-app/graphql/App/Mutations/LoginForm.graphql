# ログイン実施.
mutation ActionAppLoginFormLogin(
  $email: String
  $password: String
) {
  ActionAppLoginFormLogin(
    email: $email
    password: $password
  ) {
    status_code
    status_message
    errors
  }
}

# ログアウト実施.
mutation ActionAppLoginFormLogout {
  ActionAppLoginFormLogout {
    status_code
    status_message
    errors
  }
}

# ガードチェック用.
mutation ActionAppLoginFormCheck {
  ActionAppLoginFormCheck {
    status_code
    status_message
    errors
  }
}
