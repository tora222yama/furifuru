# App/Redis.graphql

extend type Query {
  # Redisから値を取得.
  AppRedis(
    sample_argument: String!
  ): AppRedis! @field(resolver: "App\\GraphQL\\App\\Queries\\AppRedisQuery")
}

extend type Mutation {
  # Redisへ保存する値の更新.
  ActionAppRedisUpdate(
    store_value: String
  ): Response @field(resolver: "App\\GraphQL\\App\\Mutations\\ActionAppRedisUpdate")
}

type AppRedis {
  store_value: String!
}
