# App/LoginForm.graphql

extend type Mutation {
  # ログイン実施.
  ActionAppLoginFormLogin(
    email: String
    password: String
  ): Response @field(resolver: "App\\GraphQL\\App\\Mutations\\ActionAppLoginFormLogin")

  # ログアウト実施.
  ActionAppLoginFormLogout: Response @field(resolver: "App\\GraphQL\\App\\Mutations\\ActionAppLoginFormLogout")
}

extend type Mutation @guard {
  # ログインチェック.
  ActionAppLoginFormCheck: Response @field(resolver: "App\\GraphQL\\App\\Mutations\\ActionAppLoginFormCheck")
}
